<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DropRank Live</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f4f1;
    --surface-2: #ebe9e3;
    --ink: #15140f;
    --ink-muted: #726e62;
    --accent: #c97a1e;
    --accent-ink: #15140f;
    --line: #e3dfd4;
    --up: #ce3b3b;
    --down: #2f5fd6;
    --live: #2f9e5b;
    --danger: #b23b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131210;
      --surface: #1c1a16;
      --surface-2: #262319;
      --ink: #f2efe6;
      --ink-muted: #a49d8a;
      --accent: #e2a13f;
      --accent-ink: #15140f;
      --line: #322e25;
      --up: #ea5c5c;
      --down: #6f92ff;
      --live: #3fbd76;
      --danger: #e07a7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 720px; margin: 0 auto; padding: 2.25rem 1.25rem 4rem; }

  .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .wordmark { font-weight: 800; font-size: clamp(2rem, 6vw, 2.75rem); letter-spacing: -0.03em; line-height: 1; margin: 0; }
  .wordmark span { color: var(--accent); }
  .masthead-meta {
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums; font-size: 0.8rem; color: var(--ink-muted);
  }
  .live-badge { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 700; letter-spacing: 0.06em; color: var(--ink); }
  .visit-stats { color: var(--ink-muted); }
  .visit-stats b { color: var(--ink); font-weight: 700; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 rgba(47,158,91,0.5); animation: pulse 1.8s ease-out infinite; }
  .live-dot.error { background: var(--danger); animation: none; }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(47,158,91,0.45); }
    70% { box-shadow: 0 0 0 7px rgba(47,158,91,0); }
    100% { box-shadow: 0 0 0 0 rgba(47,158,91,0); }
  }

  .tear { margin: 1.5rem 0 1.25rem; border: none; border-top: 1.5px dashed var(--line); }

  .filters { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 1.5rem; }
  .segmented { display: inline-flex; gap: 0.3rem; }
  .tabs { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.25rem; scrollbar-width: thin; }
  .tab {
    flex: 0 0 auto; padding: 0.45rem 0.85rem; border-radius: 3px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-muted); font-size: 0.82rem; font-weight: 600;
    letter-spacing: 0.01em; cursor: pointer;
  }
  .tab:hover { color: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

  .search-box {
    width: 100%;
    padding: 0.55rem 0.75rem;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 0.88rem;
    font-family: inherit;
  }
  .search-box::placeholder { color: var(--ink-muted); }
  .search-box:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .list-header { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 0.6rem; color: var(--ink-muted); font-size: 0.78rem; }
  .list-header .err { color: var(--danger); font-weight: 600; }

  .list { display: flex; flex-direction: column; border-top: 1px solid var(--line); min-height: 12rem; }

  .row {
    display: grid; grid-template-columns: 2.4rem 1fr auto auto; align-items: center; gap: 0.9rem;
    padding: 0.7rem 0.25rem; border-bottom: 1px solid var(--line); background: var(--bg); text-decoration: none; color: inherit;
  }
  .row.sold-out { opacity: 0.55; }

  .rank { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.2rem; }
  .rank.new-entry { color: var(--accent); }

  .item-text { min-width: 0; }
  .brand-line { display: flex; align-items: center; gap: 0.4rem; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); margin-bottom: 0.15rem; }
  .badge { padding: 0.05rem 0.35rem; border-radius: 2px; font-size: 0.64rem; font-weight: 700; text-transform: none; background: var(--surface-2); color: var(--ink-muted); }
  .name-line { font-size: 0.96rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .price-wrap { text-align: right; white-space: nowrap; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }
  .price { font-size: 0.92rem; font-weight: 600; }
  .price-orig { font-size: 0.72rem; color: var(--ink-muted); text-decoration: line-through; margin-right: 0.35rem; }
  .price-discount { color: var(--up); font-weight: 700; margin-right: 0.35rem; }

  .trend { min-width: 2.6rem; text-align: right; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
  .trend.up { color: var(--up); }
  .trend.down { color: var(--down); }
  .trend.flat { color: var(--ink-muted); }
  .trend.badge-new { color: var(--accent-ink); background: var(--accent); padding: 0.15rem 0.4rem; border-radius: 2px; font-size: 0.68rem; }

  .state-msg { padding: 2.5rem 0.5rem; text-align: center; color: var(--ink-muted); font-size: 0.88rem; }

  .foot-note { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: 0.75rem; line-height: 1.6; color: var(--ink-muted); }

  @media (max-width: 480px) {
    .row { grid-template-columns: 1.8rem 1fr auto; row-gap: 0.15rem; }
    .price-wrap { display: none; }
    .name-line { white-space: normal; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="masthead">
    <p class="wordmark">Drop<span>Rank</span></p>
    <div class="masthead-meta">
      <span class="live-badge"><span class="live-dot" id="liveDot"></span><span id="liveText">연결 중</span></span>
      <span id="clock">--:--:--</span>
      <span id="visitStats" class="visit-stats"></span>
    </div>
  </div>

  <hr class="tear" />

  <div class="filters">
    <div class="segmented" role="tablist" aria-label="사이트" id="siteTabs"></div>
    <div class="segmented" role="tablist" aria-label="성별" id="genderTabs"></div>
    <div class="segmented" role="tablist" aria-label="최소 가격" id="priceTabs"></div>
    <div class="tabs" role="tablist" aria-label="카테고리" id="categoryTabs"></div>
    <input type="search" id="searchInput" class="search-box" placeholder="브랜드 또는 상품명 검색" autocomplete="off" />
  </div>

  <div class="list-header">
    <span id="listCaption">전체 · 전체 · 실시간 · 5만원 이상</span>
    <span id="updatedAt">불러오는 중…</span>
  </div>

  <div class="list" id="list"></div>

  <p class="foot-note">
    이 페이지는 무신사·에이블리 랭킹을 주기적으로 가져와 Supabase에 기록한 데이터를 그대로 보여주는
    조회 전용 페이지입니다. 무신사는 GitHub Actions가 10분마다, 에이블리는 로컬 PC 수집기가 주기적으로
    데이터를 채웁니다(에이블리는 세션 토큰 방식이라 토큰이 만료되면 수집이 잠시 멈출 수 있어요). 실제
    가격·재고는 각 사이트에서 다시 확인해주세요.
  </p>
</div>

<script>
(function () {
  var SUPABASE_URL = "https://blykenseazunyrxkslkm.supabase.co";
  var SUPABASE_KEY = "sb_publishable_YzZ7-HuyTWfwR9SQ_A6n7Q_imyR0Jjh";
  var TABLE_BY_SITE = { musinsa: "ranking_snapshots", ably: "ably_ranking_snapshots" };
  var POLL_MS = 20000;

  var SITES = [
    { key: "musinsa", label: "무신사" },
    { key: "ably", label: "에이블리" }
  ];
  var GENDERS = [
    { key: "A", label: "전체" },
    { key: "W", label: "여성" },
    { key: "M", label: "남성" }
  ];
  var CATEGORIES_BY_SITE = {
    musinsa: [
      { code: "000", label: "전체" },
      { code: "001", label: "상의" },
      { code: "002", label: "아우터" },
      { code: "003", label: "바지" },
      { code: "100", label: "원피스/스커트" },
      { code: "103", label: "신발" },
      { code: "004", label: "가방" },
      { code: "120", label: "모자" },
      { code: "101", label: "소품" },
      { code: "026", label: "속옷/홈웨어" },
      { code: "017", label: "스포츠/레저" },
      { code: "104", label: "뷰티" },
      { code: "102", label: "디지털/라이프" },
      { code: "106", label: "키즈" }
    ],
    ably: [
      { code: "000", label: "전체" },
      { code: "001", label: "패션" },
      { code: "002", label: "라이프" },
      { code: "003", label: "뷰티" },
      { code: "004", label: "디지털" },
      { code: "659", label: "푸드" },
      { code: "027", label: "플레이스" }
    ]
  };

  var PRICE_TIERS = [
    { key: 50000, label: "5만원 이상" },
    { key: 100000, label: "10만원 이상" }
  ];

  var state = { site: "musinsa", gf: "A", categoryCode: "000", minPrice: 50000, query: "" };
  var lastItems = [];

  var siteTabsEl = document.getElementById("siteTabs");
  var genderTabsEl = document.getElementById("genderTabs");
  var priceTabsEl = document.getElementById("priceTabs");
  var categoryTabsEl = document.getElementById("categoryTabs");
  var searchInputEl = document.getElementById("searchInput");
  var captionEl = document.getElementById("listCaption");
  var listEl = document.getElementById("list");
  var updatedEl = document.getElementById("updatedAt");
  var clockEl = document.getElementById("clock");
  var liveDot = document.getElementById("liveDot");
  var liveText = document.getElementById("liveText");
  var visitStatsEl = document.getElementById("visitStats");
  var lastRankMap = {};

  function logVisit() {
    fetch(SUPABASE_URL + "/rest/v1/page_visits", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json", "Prefer": "return=minimal" }, sbHeaders()),
      body: "{}"
    }).catch(function () {});
  }

  function loadVisitStats() {
    fetch(SUPABASE_URL + "/rest/v1/visit_stats?select=today_unique,total_unique", { headers: sbHeaders() })
      .then(function (res) { return res.json(); })
      .then(function (rows) {
        if (!rows || !rows.length) return;
        var stats = rows[0];
        visitStatsEl.innerHTML = "오늘 <b>" + stats.today_unique + "</b>명 · 누적 <b>" + stats.total_unique + "</b>명";
      })
      .catch(function () {});
  }

  function renderTabs(container, list, keyProp, activeKey, onPick) {
    container.innerHTML = "";
    list.forEach(function (item) {
      var key = item[keyProp];
      var btn = document.createElement("button");
      btn.className = "tab";
      btn.type = "button";
      btn.textContent = item.label;
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", key === activeKey ? "true" : "false");
      btn.addEventListener("click", function () {
        if (key === activeKey) return;
        onPick(key);
      });
      container.appendChild(btn);
    });
  }

  function renderFilterTabs() {
    var isAbly = state.site === "ably";
    genderTabsEl.style.display = isAbly ? "none" : "";

    renderTabs(siteTabsEl, SITES, "key", state.site, function (key) {
      state.site = key;
      state.categoryCode = "000";
      state.gf = "A";
      lastRankMap = {};
      lastItems = [];
      renderFilterTabs();
      loadLatest();
    });
    renderTabs(genderTabsEl, GENDERS, "key", state.gf, function (key) {
      state.gf = key;
      lastRankMap = {};
      renderFilterTabs();
      loadLatest();
    });
    renderTabs(categoryTabsEl, CATEGORIES_BY_SITE[state.site], "code", state.categoryCode, function (code) {
      state.categoryCode = code;
      lastRankMap = {};
      renderFilterTabs();
      loadLatest();
    });
    renderTabs(priceTabsEl, PRICE_TIERS, "key", state.minPrice, function (key) {
      state.minPrice = key;
      lastRankMap = {};
      renderFilterTabs();
      renderFiltered();
    });
    var siteLabel = SITES.filter(function (s) { return s.key === state.site; })[0].label;
    var genderLabel = GENDERS.filter(function (g) { return g.key === state.gf; })[0].label;
    var catLabel = CATEGORIES_BY_SITE[state.site].filter(function (c) { return c.code === state.categoryCode; })[0].label;
    var priceLabel = PRICE_TIERS.filter(function (p) { return p.key === state.minPrice; })[0].label;
    captionEl.textContent = siteLabel + " · " + (isAbly ? "" : genderLabel + " · ") + catLabel + " · 실시간 · " + priceLabel;
  }

  function renderFiltered() {
    var q = state.query.trim().toLowerCase();
    var filtered = lastItems.filter(function (it) {
      if (it.price < state.minPrice) return false;
      if (!q) return true;
      return (it.brand + " " + it.name).toLowerCase().indexOf(q) !== -1;
    });
    filtered.forEach(function (it, idx) { it.rank = idx + 1; });
    renderRows(filtered);
  }

  function fmtPrice(n) { return (n || 0).toLocaleString("ko-KR") + "원"; }

  function sbHeaders() {
    return { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY };
  }

  function setLive(status, label) {
    liveDot.className = "live-dot" + (status === "error" ? " error" : "");
    liveText.textContent = label;
  }

  function renderRows(items) {
    listEl.innerHTML = "";
    if (!items.length) {
      var msg = document.createElement("div");
      msg.className = "state-msg";
      msg.textContent = "아직 저장된 데이터가 없습니다.";
      listEl.appendChild(msg);
      return;
    }
    items.forEach(function (it) {
      var rank = it.rank;
      var prevRank = lastRankMap[it.product_id];
      var delta = prevRank ? prevRank - rank : 0;

      var row = document.createElement("a");
      row.href = state.site === "ably"
        ? "https://m.a-bly.com/goods/" + it.product_id
        : "https://www.musinsa.com/products/" + it.product_id;
      row.target = "_blank";
      row.rel = "noopener";
      row.className = "row" + (it.sold_out ? " sold-out" : "");

      var rankEl = document.createElement("div");
      rankEl.className = "rank" + (prevRank === undefined ? " new-entry" : "");
      rankEl.textContent = rank;

      var textEl = document.createElement("div");
      textEl.className = "item-text";
      var brandLine = document.createElement("div");
      brandLine.className = "brand-line";
      var brandSpan = document.createElement("span");
      brandSpan.textContent = it.brand;
      brandLine.appendChild(brandSpan);
      if (it.sold_out) {
        var soldBadge = document.createElement("span");
        soldBadge.className = "badge";
        soldBadge.textContent = "품절";
        brandLine.appendChild(soldBadge);
      }
      var nameLine = document.createElement("div");
      nameLine.className = "name-line";
      nameLine.textContent = it.name;
      textEl.appendChild(brandLine);
      textEl.appendChild(nameLine);

      var priceWrap = document.createElement("div");
      priceWrap.className = "price-wrap";
      if (it.discount > 0) {
        var discountSpan = document.createElement("span");
        discountSpan.className = "price-discount";
        discountSpan.textContent = it.discount + "%";
        var origSpan = document.createElement("span");
        origSpan.className = "price-orig";
        origSpan.textContent = fmtPrice(it.original_price);
        priceWrap.appendChild(discountSpan);
        priceWrap.appendChild(origSpan);
      }
      var priceSpan = document.createElement("span");
      priceSpan.className = "price";
      priceSpan.textContent = fmtPrice(it.price);
      priceWrap.appendChild(priceSpan);

      var trendEl = document.createElement("div");
      if (prevRank === undefined) {
        trendEl.className = "trend badge-new";
        trendEl.textContent = "NEW";
      } else if (delta > 0) {
        trendEl.className = "trend up";
        trendEl.textContent = "▲" + delta;
      } else if (delta < 0) {
        trendEl.className = "trend down";
        trendEl.textContent = "▼" + Math.abs(delta);
      } else {
        trendEl.className = "trend flat";
        trendEl.textContent = "–";
      }

      row.appendChild(rankEl);
      row.appendChild(textEl);
      row.appendChild(priceWrap);
      row.appendChild(trendEl);
      listEl.appendChild(row);

      lastRankMap[it.product_id] = rank;
    });
  }

  function loadLatest() {
    var requestSite = state.site;
    var requestGf = state.gf;
    var requestCategoryCode = state.categoryCode;
    var isAbly = requestSite === "ably";
    var base = SUPABASE_URL + "/rest/v1/" + TABLE_BY_SITE[requestSite];
    var siteFilter = isAbly ? "" : "&gf=eq." + requestGf;
    var latestUrl = base + "?select=fetched_at" + siteFilter + "&category_code=eq." + requestCategoryCode +
      "&order=fetched_at.desc&limit=1";

    function stillCurrent() {
      return requestSite === state.site && requestGf === state.gf && requestCategoryCode === state.categoryCode;
    }

    fetch(latestUrl, { headers: sbHeaders() })
      .then(function (res) { return res.json(); })
      .then(function (latest) {
        if (!stillCurrent()) return;
        if (!latest.length) {
          renderRows([]);
          setLive("ok", "LIVE");
          updatedEl.textContent = "저장된 데이터 없음";
          return;
        }
        var ts = latest[0].fetched_at;
        var batchUrl = base + "?select=*" + siteFilter + "&category_code=eq." + requestCategoryCode +
          "&fetched_at=eq." + encodeURIComponent(ts) + "&order=rank.asc";
        return fetch(batchUrl, { headers: sbHeaders() })
          .then(function (res) { return res.json(); })
          .then(function (rows) {
            if (!stillCurrent()) return;
            lastItems = rows;
            renderFiltered();
            var stamp = new Date(ts);
            updatedEl.textContent = "기록 시각 " + stamp.toLocaleTimeString("ko-KR", { hour12: false, timeZone: "Asia/Seoul" }) +
              " (" + stamp.toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul" }) + ")";
            setLive("ok", "LIVE");
          });
      })
      .catch(function (err) {
        setLive("error", "연결 실패");
        var errEl = document.createElement("span");
        errEl.className = "err";
        errEl.textContent = "불러오기 실패: " + err.message;
        updatedEl.innerHTML = "";
        updatedEl.appendChild(errEl);
      });
  }

  function tickClock() {
    var now = new Date();
    clockEl.textContent = now.toLocaleTimeString("ko-KR", { hour12: false, timeZone: "Asia/Seoul" });
  }

  searchInputEl.addEventListener("input", function () {
    state.query = searchInputEl.value;
    lastRankMap = {};
    renderFiltered();
  });

  renderFilterTabs();
  loadLatest();
  setInterval(loadLatest, POLL_MS);
  tickClock();
  setInterval(tickClock, 1000);

  try {
    var todayKey = "droprank_visited_" + new Date().toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul" });
    if (!sessionStorage.getItem(todayKey)) {
      sessionStorage.setItem(todayKey, "1");
      logVisit();
    }
  } catch (e) {
    logVisit();
  }
  loadVisitStats();
  setInterval(loadVisitStats, 30000);
})();
</script>
</body>
</html>
