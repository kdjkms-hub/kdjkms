<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DropRank Live</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f4f1;
    --surface-2: #ebe9e3;
    --ink: #15140f;
    --ink-muted: #726e62;
    --accent: #c97a1e;
    --accent-ink: #15140f;
    --line: #e3dfd4;
    --up: #ce3b3b;
    --down: #2f5fd6;
    --live: #2f9e5b;
    --danger: #b23b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131210;
      --surface: #1c1a16;
      --surface-2: #262319;
      --ink: #f2efe6;
      --ink-muted: #a49d8a;
      --accent: #e2a13f;
      --accent-ink: #15140f;
      --line: #322e25;
      --up: #ea5c5c;
      --down: #6f92ff;
      --live: #3fbd76;
      --danger: #e07a7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 900px; margin: 0 auto; padding: 2.25rem 1.25rem 4rem; }

  .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .wordmark {
    font-weight: 800; font-size: clamp(2rem, 6vw, 2.75rem); letter-spacing: -0.03em; line-height: 1; margin: 0;
    background: none; border: none; padding: 0; font-family: inherit; color: var(--ink); cursor: pointer;
  }
  .wordmark:hover { opacity: 0.85; }
  .wordmark:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .wordmark span { color: var(--accent); }
  .masthead-meta {
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums; font-size: 0.8rem; color: var(--ink-muted);
  }
  .live-badge { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 700; letter-spacing: 0.06em; color: var(--ink); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 rgba(47,158,91,0.5); animation: pulse 1.8s ease-out infinite; }
  .live-dot.error { background: var(--danger); animation: none; }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(47,158,91,0.45); }
    70% { box-shadow: 0 0 0 7px rgba(47,158,91,0); }
    100% { box-shadow: 0 0 0 0 rgba(47,158,91,0); }
  }

  .tear { margin: 1.5rem 0 1.25rem; border: none; border-top: 1.5px dashed var(--line); }

  .filters { display: flex; flex-direction: column; gap: 0.55rem; }
  .segmented { display: inline-flex; gap: 0.3rem; }
  .tabs { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.25rem; scrollbar-width: thin; }
  .tab {
    flex: 0 0 auto; padding: 0.45rem 0.85rem; border-radius: 3px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-muted); font-size: 0.82rem; font-weight: 600;
    letter-spacing: 0.01em; cursor: pointer;
  }
  .tab:hover { color: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

  .search-box {
    width: 100%;
    padding: 0.55rem 0.75rem;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 0.88rem;
    font-family: inherit;
  }
  .search-box::placeholder { color: var(--ink-muted); }
  .search-box:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .list-header { display: flex; justify-content: space-between; align-items: baseline; margin: 1.5rem 0 0.6rem; color: var(--ink-muted); font-size: 0.78rem; }
  .list-header .err { color: var(--danger); font-weight: 600; }

  .selection-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; border-radius: 3px;
    background: color-mix(in srgb, var(--accent) 12%, var(--bg));
    font-size: 0.8rem; font-weight: 600; color: var(--ink);
  }
  .selection-bar[hidden] { display: none; }
  .selection-bar button {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink-muted);
    border-radius: 3px; padding: 0.3rem 0.6rem; font-size: 0.75rem; font-weight: 600; cursor: pointer;
  }
  .selection-bar button:hover { color: var(--ink); }

  .list { display: flex; flex-direction: column; border-top: 1px solid var(--line); min-height: 12rem; position: relative; }

  .row {
    display: grid; grid-template-columns: 1.5rem 2.4rem 3rem 1fr auto auto; align-items: center; gap: 0.9rem;
    padding: 0.7rem 0.25rem; border-bottom: 1px solid var(--line); background: var(--bg); text-decoration: none; color: inherit;
  }
  .row.flash { background: var(--surface); }
  .row.sold-out { opacity: 0.55; }
  .row.selected { background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }

  .select-toggle {
    width: 1.25rem; height: 1.25rem; border-radius: 50%; border: 1.5px solid var(--line);
    background: var(--bg); cursor: pointer; padding: 0; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
  }
  .select-toggle:hover { border-color: var(--accent); }
  .select-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .select-toggle.checked { background: var(--accent); border-color: var(--accent); }
  .select-toggle.checked::after {
    content: ""; width: 0.4rem; height: 0.65rem; border: solid var(--accent-ink);
    border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px);
  }

  .rank { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.2rem; }
  .rank.new-entry { color: var(--accent); }

  .thumb { width: 3rem; height: 3rem; border-radius: 3px; object-fit: cover; background: var(--surface-2); flex: 0 0 auto; }

  .item-text { min-width: 0; }
  .brand-line { display: flex; align-items: center; gap: 0.4rem; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); margin-bottom: 0.15rem; }
  .badge { padding: 0.05rem 0.35rem; border-radius: 2px; font-size: 0.64rem; font-weight: 700; letter-spacing: 0; text-transform: none; }
  .name-line { font-size: 0.96rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub-line { margin-top: 0.2rem; font-size: 0.72rem; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .price-wrap { text-align: right; white-space: nowrap; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }
  .price { font-size: 0.92rem; font-weight: 600; }
  .price-orig { font-size: 0.72rem; color: var(--ink-muted); text-decoration: line-through; margin-right: 0.35rem; }
  .price-discount { color: var(--up); font-weight: 700; margin-right: 0.35rem; }

  .trend { min-width: 2.6rem; text-align: right; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
  .trend.up { color: var(--up); }
  .trend.down { color: var(--down); }
  .trend.flat { color: var(--ink-muted); }
  .trend.badge-new { color: var(--accent-ink); background: var(--accent); padding: 0.15rem 0.4rem; border-radius: 2px; font-size: 0.68rem; }

  .state-msg { padding: 2.5rem 0.5rem; text-align: center; color: var(--ink-muted); font-size: 0.88rem; }

  .foot-note { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: 0.75rem; line-height: 1.6; color: var(--ink-muted); }

  @media (max-width: 560px) {
    .row { grid-template-columns: 1.3rem 1.8rem 2.5rem 1fr auto; row-gap: 0.15rem; }
    .price-wrap { display: none; }
    .name-line { white-space: normal; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="masthead">
    <button type="button" id="wordmarkBtn" class="wordmark" aria-label="처음 상태로 새로고침">Drop<span>Rank</span> <span style="font-size:0.4em; color:var(--ink-muted); font-weight:600;">LIVE</span></button>
    <div class="masthead-meta">
      <span class="live-badge"><span class="live-dot" id="liveDot"></span><span id="liveText">연결 중</span></span>
      <span id="clock">--:--:--</span>
    </div>
  </div>

  <hr class="tear" />

  <div class="filters">
    <div class="segmented" role="tablist" aria-label="사이트" id="siteTabs"></div>
    <div class="segmented" role="tablist" aria-label="성별" id="genderTabs"></div>
    <div class="segmented" role="tablist" aria-label="최소 가격" id="priceTabs"></div>
    <div class="tabs" role="tablist" aria-label="카테고리" id="categoryTabs"></div>
    <input type="search" id="searchInput" class="search-box" placeholder="브랜드 또는 상품명 검색" autocomplete="off" />
  </div>

  <div class="list-header">
    <span id="listCaption">전체 · 실시간</span>
    <span id="updatedAt">불러오는 중…</span>
  </div>

  <div class="selection-bar" id="selectionBar" hidden>
    <span id="selectionCount">0개 선택됨</span>
    <button type="button" id="clearSelectionBtn">선택 해제</button>
  </div>

  <div class="list" id="list"></div>

  <p class="foot-note">
    이 페이지는 로컬 서버(<code>server.py</code>)가 무신사의 공개 랭킹 데이터를 20~45초 주기로 불러와 표시하는
    개인용 데모입니다. 무신사의 공식 오픈 API가 아닌 웹사이트 내부 엔드포인트를 사용하며, 구조가 바뀌면 동작이
    멈출 수 있습니다. 실제 가격·재고·품절 여부는 클릭 시 이동하는 무신사 상품 페이지에서 다시 확인해주세요.
    최소 가격 필터를 선택하면 해당 기준 미만 상품은 제외하고 남은 상품끼리 다시 순위를 매겨 보여줍니다.
  </p>
</div>

<script>
(function () {
  var SITES = [
    { key: "musinsa", label: "무신사" },
    { key: "ably", label: "에이블리" }
  ];
  var GENDERS = [
    { key: "A", label: "전체" },
    { key: "W", label: "여성" },
    { key: "M", label: "남성" }
  ];
  var CATEGORIES_BY_SITE = {
    musinsa: [
      { code: "000", label: "전체" },
      { code: "001", label: "상의" },
      { code: "002", label: "아우터" },
      { code: "003", label: "바지" },
      { code: "100", label: "원피스/스커트" },
      { code: "103", label: "신발" },
      { code: "004", label: "가방" },
      { code: "120", label: "모자" },
      { code: "101", label: "소품" },
      { code: "026", label: "속옷/홈웨어" },
      { code: "017", label: "스포츠/레저" },
      { code: "104", label: "뷰티" },
      { code: "102", label: "디지털/라이프" },
      { code: "106", label: "키즈" }
    ],
    ably: [
      { code: "000", label: "전체" },
      { code: "001", label: "패션" },
      { code: "002", label: "라이프" },
      { code: "003", label: "뷰티" },
      { code: "004", label: "디지털" },
      { code: "659", label: "푸드" },
      { code: "027", label: "플레이스" }
    ]
  };

  var PRICE_TIERS = [
    { key: 0, label: "전체" },
    { key: 50000, label: "5만원 이상" },
    { key: 100000, label: "10만원 이상" }
  ];

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var state = { site: "musinsa", gf: "A", categoryCode: "000", minPrice: 0, query: "" };
  var lastRankMap = {};
  var lastItems = [];
  var selectedIds = {};
  var pollTimer = null;
  var POLL_MS = 20000;

  var siteTabsEl = document.getElementById("siteTabs");
  var genderTabsEl = document.getElementById("genderTabs");
  var categoryTabsEl = document.getElementById("categoryTabs");
  var priceTabsEl = document.getElementById("priceTabs");
  var searchInputEl = document.getElementById("searchInput");
  var listEl = document.getElementById("list");
  var captionEl = document.getElementById("listCaption");
  var updatedEl = document.getElementById("updatedAt");
  var clockEl = document.getElementById("clock");
  var liveDot = document.getElementById("liveDot");
  var liveText = document.getElementById("liveText");
  var selectionBarEl = document.getElementById("selectionBar");
  var selectionCountEl = document.getElementById("selectionCount");
  var clearSelectionBtn = document.getElementById("clearSelectionBtn");

  function fmtPrice(n) { return (n || 0).toLocaleString("ko-KR") + "원"; }

  function renderTabs(container, list, keyProp, activeKey, onPick) {
    container.innerHTML = "";
    list.forEach(function (item) {
      var key = item[keyProp];
      var btn = document.createElement("button");
      btn.className = "tab";
      btn.type = "button";
      btn.textContent = item.label;
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", key === activeKey ? "true" : "false");
      btn.addEventListener("click", function () {
        if (key === activeKey) return;
        onPick(key);
      });
      container.appendChild(btn);
    });
  }

  function renderFilterTabs() {
    var isAbly = state.site === "ably";
    genderTabsEl.style.display = isAbly ? "none" : "";

    renderTabs(siteTabsEl, SITES, "key", state.site, function (key) {
      state.site = key;
      state.categoryCode = "000";
      state.gf = "A";
      lastRankMap = {};
      lastItems = [];
      renderFilterTabs();
      loadRanking(false);
    });
    renderTabs(genderTabsEl, GENDERS, "key", state.gf, function (key) {
      state.gf = key;
      lastRankMap = {};
      renderFilterTabs();
      loadRanking(false);
    });
    renderTabs(categoryTabsEl, CATEGORIES_BY_SITE[state.site], "code", state.categoryCode, function (code) {
      state.categoryCode = code;
      lastRankMap = {};
      renderFilterTabs();
      loadRanking(false);
    });
    renderTabs(priceTabsEl, PRICE_TIERS, "key", state.minPrice, function (key) {
      state.minPrice = key;
      lastRankMap = {};
      renderFilterTabs();
      renderFiltered(false);
    });
    var siteLabel = SITES.filter(function (s) { return s.key === state.site; })[0].label;
    var genderLabel = GENDERS.filter(function (g) { return g.key === state.gf; })[0].label;
    var catLabel = CATEGORIES_BY_SITE[state.site].filter(function (c) { return c.code === state.categoryCode; })[0].label;
    var priceLabel = PRICE_TIERS.filter(function (p) { return p.key === state.minPrice; })[0].label;
    captionEl.textContent = siteLabel + " · " + (isAbly ? "" : genderLabel + " · ") + catLabel + " · 실시간 · " + priceLabel;
  }

  function renderFiltered(animate) {
    var q = state.query.trim().toLowerCase();
    var filtered = lastItems.filter(function (it) {
      if (it.price < state.minPrice) return false;
      if (!q) return true;
      return (it.brand + " " + it.name).toLowerCase().indexOf(q) !== -1;
    });
    filtered.forEach(function (it, idx) { it.rank = idx + 1; });
    renderRows(filtered, animate);
  }

  function setLive(status, label) {
    liveDot.className = "live-dot" + (status === "error" ? " error" : "");
    liveText.textContent = label;
  }

  function updateSelectionBar() {
    var count = Object.keys(selectedIds).length;
    selectionBarEl.hidden = count === 0;
    selectionCountEl.textContent = count + "개 선택됨";
  }

  function renderRows(items, animate) {
    var firstRects = {};
    if (animate && !reduceMotion) {
      Array.prototype.forEach.call(listEl.children, function (child) {
        var id = child.getAttribute("data-id");
        if (id) firstRects[id] = child.getBoundingClientRect();
      });
    }

    listEl.innerHTML = "";

    if (!items.length) {
      var msg = document.createElement("div");
      msg.className = "state-msg";
      msg.textContent = "표시할 상품이 없습니다.";
      listEl.appendChild(msg);
      return;
    }

    items.forEach(function (it) {
      var rank = it.rank;
      var prevRank = lastRankMap[it.id];
      var delta = prevRank ? prevRank - rank : 0;

      var isSelected = !!selectedIds[it.id];

      var row = document.createElement("a");
      row.href = it.url || "#";
      row.target = "_blank";
      row.rel = "noopener";
      row.className = "row" + (it.soldOut ? " sold-out" : "") + (isSelected ? " selected" : "");
      row.setAttribute("data-id", it.id);

      var toggleEl = document.createElement("button");
      toggleEl.type = "button";
      toggleEl.className = "select-toggle" + (isSelected ? " checked" : "");
      toggleEl.setAttribute("aria-pressed", isSelected ? "true" : "false");
      toggleEl.setAttribute("aria-label", "선택");
      toggleEl.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        if (selectedIds[it.id]) {
          delete selectedIds[it.id];
        } else {
          selectedIds[it.id] = true;
        }
        var nowSelected = !!selectedIds[it.id];
        toggleEl.classList.toggle("checked", nowSelected);
        toggleEl.setAttribute("aria-pressed", nowSelected ? "true" : "false");
        row.classList.toggle("selected", nowSelected);
        updateSelectionBar();
      });

      var rankEl = document.createElement("div");
      rankEl.className = "rank" + (prevRank === undefined ? " new-entry" : "");
      rankEl.textContent = rank;

      var thumb = document.createElement("img");
      thumb.className = "thumb";
      thumb.loading = "lazy";
      thumb.src = it.image;
      thumb.alt = it.name;

      var textEl = document.createElement("div");
      textEl.className = "item-text";

      var brandLine = document.createElement("div");
      brandLine.className = "brand-line";
      var brandSpan = document.createElement("span");
      brandSpan.textContent = it.brand;
      brandLine.appendChild(brandSpan);
      (it.labels || []).slice(0, 2).forEach(function (label) {
        var b = document.createElement("span");
        b.className = "badge";
        b.style.background = "var(--accent)";
        b.style.color = "var(--accent-ink)";
        b.textContent = label;
        brandLine.appendChild(b);
      });
      if (it.soldOut) {
        var soldBadge = document.createElement("span");
        soldBadge.className = "badge";
        soldBadge.style.background = "var(--surface-2)";
        soldBadge.style.color = "var(--ink-muted)";
        soldBadge.textContent = "품절";
        brandLine.appendChild(soldBadge);
      }

      var nameLine = document.createElement("div");
      nameLine.className = "name-line";
      nameLine.textContent = it.name;

      var subLine = document.createElement("div");
      subLine.className = "sub-line";
      subLine.textContent = it.note || "";

      textEl.appendChild(brandLine);
      textEl.appendChild(nameLine);
      if (it.note) textEl.appendChild(subLine);

      var priceWrap = document.createElement("div");
      priceWrap.className = "price-wrap";
      if (it.discount > 0) {
        var discountSpan = document.createElement("span");
        discountSpan.className = "price-discount";
        discountSpan.textContent = it.discount + "%";
        var origSpan = document.createElement("span");
        origSpan.className = "price-orig";
        origSpan.textContent = fmtPrice(it.originalPrice);
        priceWrap.appendChild(discountSpan);
        priceWrap.appendChild(origSpan);
      }
      var priceSpan = document.createElement("span");
      priceSpan.className = "price";
      priceSpan.textContent = fmtPrice(it.price);
      priceWrap.appendChild(priceSpan);

      var trendEl = document.createElement("div");
      if (prevRank === undefined) {
        trendEl.className = "trend badge-new";
        trendEl.textContent = "NEW";
      } else if (delta > 0) {
        trendEl.className = "trend up";
        trendEl.textContent = "▲" + delta;
      } else if (delta < 0) {
        trendEl.className = "trend down";
        trendEl.textContent = "▼" + Math.abs(delta);
      } else {
        trendEl.className = "trend flat";
        trendEl.textContent = "–";
      }

      row.appendChild(toggleEl);
      row.appendChild(rankEl);
      row.appendChild(thumb);
      row.appendChild(textEl);
      row.appendChild(priceWrap);
      row.appendChild(trendEl);
      listEl.appendChild(row);

      lastRankMap[it.id] = rank;
    });

    if (animate && !reduceMotion) {
      Array.prototype.forEach.call(listEl.children, function (child) {
        var id = child.getAttribute("data-id");
        var first = firstRects[id];
        if (!first) return;
        var last = child.getBoundingClientRect();
        var dy = first.top - last.top;
        if (dy) {
          child.style.transform = "translateY(" + dy + "px)";
          child.style.transition = "transform 0s";
          requestAnimationFrame(function () {
            child.style.transform = "";
            child.style.transition = "transform 420ms cubic-bezier(.2,.7,.3,1)";
          });
        }
      });
    }
  }

  function loadRanking(animate) {
    var isAbly = state.site === "ably";
    var endpoint = isAbly ? "/api/ably-ranking" : "/api/ranking";
    var params = isAbly
      ? new URLSearchParams({ categoryCode: state.categoryCode })
      : new URLSearchParams({ gf: state.gf, categoryCode: state.categoryCode });
    fetch(endpoint + "?" + params.toString())
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (result) {
        if (!result.ok) throw new Error(result.body.error || "요청 실패");
        var body = result.body;
        lastItems = body.items || [];
        renderFiltered(animate);

        var stamp = body.sourceUpdatedAt ? new Date(body.sourceUpdatedAt) : new Date(body.fetchedAt * 1000);
        var timeStr = stamp.toLocaleTimeString("ko-KR", { hour12: false, timeZone: "Asia/Seoul" });
        var sourceLabel = isAbly ? "에이블리" : "무신사";
        updatedEl.innerHTML = sourceLabel + " 기준 업데이트 " + timeStr + (body.cached ? " · 캐시" : "");

        if (body.stale) {
          setLive("error", "일시 오류 · 이전 데이터 표시");
        } else {
          setLive("ok", "LIVE");
        }
      })
      .catch(function (err) {
        setLive("error", "연결 실패");
        var errEl = document.createElement("span");
        errEl.className = "err";
        updatedEl.innerHTML = "";
        errEl.textContent = "업데이트 실패: " + err.message;
        updatedEl.appendChild(errEl);
      });
  }

  function tickClock() {
    var now = new Date();
    clockEl.textContent = now.toLocaleTimeString("ko-KR", { hour12: false, timeZone: "Asia/Seoul" });
  }

  function schedulePolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function () { loadRanking(true); }, POLL_MS);
  }

  searchInputEl.addEventListener("input", function () {
    state.query = searchInputEl.value;
    lastRankMap = {};
    renderFiltered(false);
  });

  clearSelectionBtn.addEventListener("click", function () {
    selectedIds = {};
    updateSelectionBar();
    Array.prototype.forEach.call(listEl.querySelectorAll(".row.selected"), function (row) {
      row.classList.remove("selected");
    });
    Array.prototype.forEach.call(listEl.querySelectorAll(".select-toggle.checked"), function (btn) {
      btn.classList.remove("checked");
      btn.setAttribute("aria-pressed", "false");
    });
  });

  document.getElementById("wordmarkBtn").addEventListener("click", function () {
    window.location.reload();
  });

  renderFilterTabs();
  loadRanking(false);
  schedulePolling();
  tickClock();
  setInterval(tickClock, 1000);
})();
</script>
</body>
</html>
